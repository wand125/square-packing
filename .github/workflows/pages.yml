name: pages

# Builds site/ from INDEX.json, the problem folders and docs/data/, and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/data/**', 'INDEX.json', 'problems/right-isosceles/README.md', 'problems/n17/manifest.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        run: python3 site/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
